services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kbms
      MYSQL_USER: kbms
      MYSQL_PASSWORD: kbms
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-only"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
  frontend:
    image: oven/bun:1.3
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mysql_data:
